name: Reparar video de la final para moviles
on:
  push:
    branches:
      - fix/final-video-mobile-20261107
    paths:
      - .github/workflows/compatibilidad-video-final.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convertir-video:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Obtener archivos de la pagina
        uses: actions/checkout@v4
      - name: Instalar FFmpeg y FFprobe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Revisar el video original
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/aniversario/final-campeonato.mp4
          ffprobe -v error -show_entries stream=index,codec_name,profile,pix_fmt,width,height,r_frame_rate:format=duration,size,format_name -of json assets/aniversario/final-campeonato.mp4
      - name: Convertir a H264 8-bit y AAC para Android y iPhone
        shell: bash
        run: |
          set -euo pipefail
          input=assets/aniversario/final-campeonato.mp4
          output=assets/aniversario/final-campeonato-compatible.mp4
          duration="$(ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 "$input")"
          bitrate="$(python3 - "$duration" <<'PY'
          import sys
          duration = float(sys.argv[1])
          if not 0 < duration < 12*3600:
              raise SystemExit("Duracion original invalida")
          # Aproximadamente 78 MiB como maximo para alojarlo en GitHub.
          kbps = int((78*1024*1024*8/duration - 128000)/1000)
          print(max(180, min(3000, kbps)))
          PY
          )"
          echo "Video target bitrate: ${bitrate} kb/s"
          ffmpeg -hide_banner -nostdin -y -i "$input" \
            -map 0:v:0 -map 0:a:0? \
            -vf "fps=30,scale=w='min(1280,iw)':h='min(1280,ih)':force_original_aspect_ratio=decrease:force_divisible_by=2" \
            -c:v libx264 -preset medium -profile:v main -level:v 4.1 \
            -pix_fmt yuv420p -b:v "${bitrate}k" \
            -maxrate "$((bitrate * 14 / 10))k" -bufsize "$((bitrate * 3))k" \
            -c:a aac -b:a 128k -ac 2 -ar 44100 \
            -movflags +faststart -max_muxing_queue_size 1024 \
            -map_metadata -1 -map_chapters -1 \
            "$output"
          ffprobe -v error -show_entries stream=index,codec_name,profile,pix_fmt,width,height,r_frame_rate:format=duration,size -of json "$output"
          python3 - <<'PY'
          import json, pathlib, subprocess
          p = pathlib.Path('assets/aniversario/final-campeonato-compatible.mp4')
          metadata = json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-of','json',str(p)]))
          streams = metadata['streams']
          video = next(s for s in streams if s['codec_type'] == 'video')
          assert video['codec_name'] == 'h264', video
          assert video['pix_fmt'] == 'yuv420p', video
          assert all(s['codec_name'] == 'aac' for s in streams if s['codec_type'] == 'audio')
          assert p.stat().st_size < 95_000_000, 'Archivo no apto para GitHub'
          head = p.open('rb').read(1024*1024)
          assert b'moov' in head and (b'mdat' not in head or head.index(b'moov') < head.index(b'mdat')), 'Falta faststart'
          print('VALIDADO: H264 + yuv420p + AAC + faststart; bytes:',p.stat().st_size)
          PY
          ffmpeg -v error -nostdin -i "$output" -t 5 -f null -
          mv "$output" "$input"
      - name: Guardar el video optimizado en esta rama
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/aniversario/final-campeonato.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Convertir video de la final a H264 AAC apto para moviles"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
